name: Coverage

on:
  push:
    branches: [ branchSelma ]
  pull_request:
    branches: [ branchSelma ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov

      - name: Run tests and generate coverage.xml
        env:
          COVERAGE_RCFILE: MyAdventures/coverage/.coveragerc
          COVERAGE_FILE: MyAdventures/coverage/.coverage
        run: |
        # Ensure coverage output directory exists
          mkdir -p MyAdventures/coverage
          pytest --maxfail=1 --disable-warnings -q --cov=src --cov-config=MyAdventures/coverage/.coveragerc --cov-report=xml:MyAdventures/coverage/coverage.xml --cov-report=term-missing MyAdventures/src/tests

      - name: Upload coverage.xml to artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: MyAdventures/coverage/coverage.xml
      - name: Verify coverage.xml exists
        run: |
          ls -lah MyAdventures/coverage/coverage.xml
          echo "File size:"
          wc -c < MyAdventures/coverage/coverage.xml
      - name: Remove .coverage to prevent pycoverage plugin interference
        run: rm -f MyAdventures/coverage/.coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ${{ github.workspace }}/MyAdventures/coverage/coverage.xml
          disable_search: true
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }} 
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      

          
